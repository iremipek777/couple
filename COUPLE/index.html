<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Enter our secret code</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fdf2f4;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Poppins',sans-serif}
.container{display:flex;gap:45px;align-items:center;background:white;padding:40px 45px;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.08);border:3px solid #ffdde3}
.left .heart-frame{width:240px;height:300px;position:relative;background:white;border:6px solid #ffb6c1;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;overflow:hidden;box-shadow:0 12px 25px rgba(255,182,193,.6);transform:rotate(-3deg)}
.heart-frame img{width:100%;height:100%;object-fit:cover}
.bow{position:absolute;top:-5px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2}
.right{text-align:center;min-width:280px}
.right h2{font-family:'Dancing Script',cursive;color:#d44a6a;font-size:26px;margin-bottom:18px}
.display{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.dot{width:52px;height:36px;border:2px solid #ffb6c1;border-radius:18px;display:flex;justify-content:center;align-items:center;font-size:20px;color:#d44a6a}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.key{width:72px;height:72px;border-radius:50%;border:2px solid #ffd0d8;background:white;font-size:20px;cursor:pointer;transition:.2s;color:#555}
.key:hover{background:#ffb6c1;color:white;transform:scale(1.05)}
.key.heart-btn{background:#f8a4b8;color:white;border:none;font-size:18px}
.error{color:#ff4d6d;height:20px;margin-top:12px;font-size:14px}
@media(max-width:700px){.container{flex-direction:column;padding:25px}.left .heart-frame{width:200px;height:240px}}
</style></head><body>
<div class="container">
<div class="left"><div class="heart-frame"><div class="bow">🎀</div><img src="assets/gift3.jpg.jpeg"></div></div>
<div class="right">
<h2>Enter our secret code 💌</h2>
<div class="display"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
<div class="keypad">
<button class="key" onclick="press('1')">1</button><button class="key" onclick="press('2')">2</button><button class="key" onclick="press('3')">3</button>
<button class="key" onclick="press('4')">4</button><button class="key" onclick="press('5')">5</button><button class="key" onclick="press('6')">6</button>
<button class="key" onclick="press('7')">7</button><button class="key" onclick="press('8')">8</button><button class="key" onclick="press('9')">9</button>
<button class="key" onclick="clearCode()">⌫</button><button class="key" onclick="press('0')">0</button><button class="key heart-btn" onclick="check()">♥</button>
</div>
<div class="error" id="error"></div>
</div>
</div>
<script>
let code="";function update(){for(let i=0;i<4;i++){document.getElementById('d'+i).innerText=i<code.length?'♥':''}}
function press(n){if(code.length<4){code+=n;update();if(code.length===4)setTimeout(check,400)}}
function clearCode(){code="";update();document.getElementById('error').innerText="";}
function check(){if(code==="1410"){location.href="gifts.html"}else{document.getElementById('error').innerText="Yanlış kod 💔";setTimeout(()=>clearCode(),1000)}}
</script>
</body></html>
